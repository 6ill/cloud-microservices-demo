name: CI/CD - Cart Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/cartservice/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cartservice
  INFRA_REPO: ${{ github.repository_owner }}/microservices-boutique-kubernetes

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/cartservice
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-gitops-repo:
    name: Update Infrastructure Repo
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_BRIDGE_PAT }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes Manifests via Kustomize
        run: |
          # Navigate to your production environment directory
          # Adjust this path if your folder structure differs slightly
          cd deployment/environments/production
          
          kustomize edit set image gcr.io/google-samples/microservices-demo/cartservice=${{ env.IMAGE_NAME }}:${{ github.sha }}

          git config --global user.name "GitHub Actions GitOps"
          git config --global user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "GitOps Update: cartservice to commit ${{ github.sha }}"
          git push origin main