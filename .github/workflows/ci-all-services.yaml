name: CI/CD - All Microservices

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

env:
  INFRA_REPO: ${{ github.repository_owner }}/microservices-boutique-kubernetes

jobs:
  code-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go Unit Tests (Bash Loop Implementation)
        timeout-minutes: 10
        run: |
          # Dynamically loop through Go directories and run tests
          for GO_PACKAGE in "shippingservice" "productcatalogservice" "frontend/validator"; do
            echo "Testing $GO_PACKAGE..."
            pushd src/$GO_PACKAGE
            go test
            popd
          done

      - name: C# Unit Tests
        timeout-minutes: 10
        run: dotnet test src/cartservice/

  build-push-deploy:
    name: Build & Deploy Matrix
    needs: code-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If one service fails to build, don't cancel the others
      matrix:
        service: 
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch at least 2 commits to perform git diff

      - name: Check if service source code changed
        id: check_changes
        run: |
          # Use git diff to check if the specific service directory was modified in the last commit.
          # --quiet returns exit code 0 if NO changes, and 1 if there ARE changes.
          if git diff --quiet HEAD^ HEAD -- src/${{ matrix.service }}/; then
            echo "No changes detected in ${{ matrix.service }}. Skipping."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in ${{ matrix.service }}. Proceeding with build."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          # Dynamically target the Dockerfile of the current matrix service
          context: ./src/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest

      - name: Checkout Infrastructure Code
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_BRIDGE_PAT }}
          path: infra-repo # Checkout into a subfolder to avoid mixing with app code

      - name: Setup Kustomize
        if: steps.check_changes.outputs.changed == 'true'
        uses: imranismail/setup-kustomize@v2

      # Solving Concurrency with Git Rebase & Retries
      - name: Update Kubernetes Manifests (GitOps Concurrency Handling)
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cd infra-repo/deployment/environments/production
          
          kustomize edit set image us-central1-docker.pkg.dev/google-samples/microservices-demo/${{ matrix.service }}=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

          git config --global user.name "GitHub Actions GitOps"
          git config --global user.email "actions@github.com"
          
          git add kustomization.yaml
          git commit -m "GitOps Update: ${{ matrix.service }} to commit ${{ github.sha }}"

          # The Concurrency Loop
          # If multiple matrix jobs try to push exactly at the same time, Git will reject the push.
          # This loop catches the failure, pulls the latest changes from other jobs using rebase, and tries again.
          MAX_RETRIES=5
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Push attempt $i for ${{ matrix.service }}..."
            
            if git push origin HEAD; then
              echo "Push successful!"
              break
            else
              echo "Push failed (likely due to concurrent matrix jobs). Rebasing..."
              # Sleep for a random amount of time (1-10 seconds) to stagger the retry attempts
              sleep $((RANDOM % 10 + 1))
              git pull --rebase origin main
            fi
            
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
          done